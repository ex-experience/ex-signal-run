<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EX™ Requests Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-functions-compat.js"></script>
<script src="integrations/agency-config.js?v=3.1.0"></script>
<style>
:root{--bg:#09090b;--card:#131318;--line:rgba(255,255,255,.12);--text:#f4f4f6;--muted:#9999a2;--rose:#d98996}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Kufi Arabic",sans-serif}
main{width:min(1280px,92vw);margin:auto;padding:44px 0 90px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}
h1{font-family:Inter,sans-serif;letter-spacing:-.05em;font-size:clamp(2rem,6vw,5rem);margin:0}small,p{color:var(--muted)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 18px;background:#fff;color:#111;font-weight:800}.ghost{background:none;color:var(--rose);border:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar select,.toolbar input{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.item{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px}
.stat b{display:block;font:800 2rem Inter,sans-serif;color:var(--rose)}
.list{display:grid;gap:12px;margin-top:18px}.item header{margin:0 0 12px}.chip{border:1px solid rgba(217,137,150,.4);color:#f5bec8;border-radius:999px;padding:5px 8px;font:600 .62rem Inter,sans-serif}
.item p{font-size:.76rem;line-height:1.8;margin:6px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fields input,.fields textarea,.fields select{width:100%;border:1px solid var(--line);background:#0d0d11;color:#fff;border-radius:10px;padding:10px}.fields textarea{grid-column:1/-1;min-height:80px}
.actions{display:flex;gap:8px;margin-top:10px}.error{color:#ff8c8c}.ok{color:#75d799}
#authCard{max-width:560px;margin:14vh auto;padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--card)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.fields textarea{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<section id="authCard">
  <h1 style="font-size:2.5rem">EX™ CONTROL</h1>
  <p>لوحة خاصة بمدير النظام لطلبات الأعمال والاستشارات والوصول المبكر.</p>
  <button class="btn" id="signIn">الدخول بحساب Google الإداري</button>
  <p id="authStatus"></p>
</section>
<section id="app" hidden>
  <header><div><small>フサム | experience™ / OPERATIONS</small><h1>REQUESTS</h1></div><button class="btn ghost" id="signOut">خروج</button></header>
  <div class="grid">
    <div class="stat"><span>VISITS</span><b id="visits">—</b></div>
    <div class="stat"><span>COLLECTION</span><b id="collectionCount">—</b></div>
    <div class="stat"><span>ADMIN</span><b style="font-size:1rem" id="adminName">—</b></div>
  </div>
  <div class="toolbar">
    <select id="collection">
      <option value="CreativeIntakes">Creative Intakes</option>
      <option value="Consultations">Consultations</option>
      <option value="EarlyAccess">Early Access</option>
      <option value="ClientProjects">Client Projects</option>
      <option value="Gate_Registrations">Gate Registrations</option>
      <option value="VIP_Early_Access">Legacy VIP</option>
    </select>
    <button class="btn" id="reload">تحديث</button>
    <button class="btn ghost" id="seedServices">تهيئة الخدمات العامة</button>
  </div>
  <p id="status"></p><div class="list" id="list"></div>
</section>
</main>
<script>
(()=>{"use strict";
const C=window.EX_AGENCY_CONFIG,$=s=>document.querySelector(s),clean=(v,n=500)=>String(v??"").replace(/[<>]/g,"").trim().slice(0,n),ts=()=>firebase.firestore.FieldValue.serverTimestamp();
const app=firebase.apps.length?firebase.app():firebase.initializeApp(C.firebase),auth=firebase.auth(),db=firebase.firestore(),fn=firebase.app().functions(C.functionsRegion||"us-central1");
const stats=fn.httpsCallable("exGetPublicStats");
function admin(u){return u&&String(u.email||"").toLowerCase()===String(C.adminEmail||"").toLowerCase()}
$("#signIn").onclick=async()=>{try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());if(!admin(r.user)){await auth.signOut();throw new Error("هذا الحساب ليس حساب الإدارة المعتمد.");}}catch(e){$("#authStatus").textContent=e.message;$("#authStatus").className="error"}};
$("#signOut").onclick=()=>auth.signOut();$("#reload").onclick=load;$("#collection").onchange=load;
auth.onAuthStateChanged(async u=>{if(admin(u)){ $("#authCard").hidden=true;$("#app").hidden=false;$("#adminName").textContent=u.email;try{$("#visits").textContent=(await stats({})).data.visitors.toLocaleString("en-US")}catch{}load();}else{$("#authCard").hidden=false;$("#app").hidden=true}});
function dateValue(v){try{return v?.toDate?.().getTime?.()||0}catch{return 0}}
async function load(){
 const col=$("#collection").value,list=$("#list");list.textContent="جارٍ التحميل...";$("#status").textContent="";
 try{
   const snap=await db.collection(col).limit(100).get(), rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateValue(b.UpdatedAt||b.CreatedAt||b.Timestamp)-dateValue(a.UpdatedAt||a.CreatedAt||a.Timestamp));
   $("#collectionCount").textContent=rows.length;list.innerHTML="";
   if(!rows.length){list.textContent="لا توجد سجلات.";return}
   rows.forEach(r=>list.appendChild(card(col,r)));
 }catch(e){console.error(e);list.textContent="تعذر تحميل السجلات.";$("#status").textContent=e.message;$("#status").className="error"}
}
function card(col,r){
 const el=document.createElement("article");el.className="item";
 const ref=clean(r.ReferenceCode||r.id,80), title=clean(r.Company||r.Name||r.ProjectName||r.Email||col,120);
 el.innerHTML=`<header><div><b>${title}</b><p>${ref}</p></div><span class="chip">${clean(r.Status||"—",40)}</span></header>
 <p>${clean(r.Email||"",180)} ${r.Phone?"· "+clean(r.Phone,40):""}</p>
 <p>${clean(r.Goal||r.Message||r.Interest||"",800)}</p>
 <div class="fields"><select data-k="Status"><option>Received</option><option>In Review</option><option>Qualified</option><option>Discovery</option><option>Proposal</option><option>Active</option><option>Waiting Client</option><option>Completed</option><option>Closed</option></select><input data-k="Stage" placeholder="Stage"><textarea data-k="NextAction" placeholder="Next action"></textarea></div>
 <div class="actions"><button class="btn" data-save>حفظ التحديث</button><button class="btn ghost" data-note>إضافة حدث للسجل</button></div><p data-msg></p>`;
 const status=el.querySelector('[data-k="Status"]'),stage=el.querySelector('[data-k="Stage"]'),next=el.querySelector('[data-k="NextAction"]');
 status.value=r.Status||"Received";stage.value=r.Stage||"";next.value=r.NextAction||"";
 el.querySelector("[data-save]").onclick=async()=>{try{await db.collection(col).doc(r.id).update({Status:clean(status.value,50),Stage:clean(stage.value,100),NextAction:clean(next.value,500),UpdatedAt:ts()});el.querySelector("[data-msg]").textContent="تم الحفظ";el.querySelector("[data-msg]").className="ok";load()}catch(e){el.querySelector("[data-msg]").textContent=e.message;el.querySelector("[data-msg]").className="error"}};
 el.querySelector("[data-note]").onclick=async()=>{const note=prompt("اكتب ملاحظة المتابعة التي ستظهر للعميل:");if(!note)return;try{await db.collection(col).doc(r.id).collection("Timeline").add({Kind:"staff_update",TitleAr:"تحديث من الفريق",TitleEn:"Team update",NoteAr:clean(note,500),NoteEn:clean(note,500),At:ts(),Actor:auth.currentUser.uid});el.querySelector("[data-msg]").textContent="تمت إضافة الحدث";el.querySelector("[data-msg]").className="ok"}catch(e){el.querySelector("[data-msg]").textContent=e.message;el.querySelector("[data-msg]").className="error"}};
 return el;
}
$("#seedServices").onclick=async()=>{if(!confirm("إنشاء/تحديث قائمة الخدمات العامة؟"))return;const data=[
 ["strategy","01","الاستراتيجية والتموضع","Strategy & Positioning","تحويل البحث والسلوك إلى تموضع وقرار.","Turn research and behaviour into positioning and decisions."],
 ["identity","02","الهوية والأنظمة البصرية","Identity & Visual Systems","هوية تحريرية وبصرية وحركية قابلة للتوسع.","Scalable editorial, visual and motion identity."],
 ["campaign","03","الحملات","Campaigns","فكرة مركزية وسرد متعدد القنوات.","One central idea across channels."],
 ["film","04","الإنتاج السينمائي","Film Production","فكرة ومعالجة وإخراج وإنتاج وما بعد الإنتاج.","Concept, treatment, direction, production and post."],
 ["experience","05","هندسة التجربة","Experience Architecture","مساحات وطقوس وتفاعل يحول الحضور إلى ذاكرة.","Spaces, rituals and interactions that become memory."],
 ["digital","06","المنتجات الرقمية","Digital Products","مواقع ومنصات وبوابات وتجارب رقمية.","Websites, platforms, portals and digital experiences."],
 ["consulting","07","الاستشارات","Consulting","استشارات إبداعية وتنفيذية لمشكلات محددة.","Creative and executive consulting for defined challenges."],
 ["partnership","08","الشراكات الخاصة","Special Partnerships","مشاريع وشراكات وتجارب خاصة.","Special projects, partnerships and experiences."]
 ];const batch=db.batch();data.forEach(x=>{const ref=db.collection(C.collections.publicServices).doc(x[0]);batch.set(ref,{Number:x[1],NameAr:x[2],NameEn:x[3],DescriptionAr:x[4],DescriptionEn:x[5],Active:true,UpdatedAt:ts()},{merge:true})});try{await batch.commit();alert("تم تحديث الخدمات.")}catch(e){alert(e.message)}};
})();
</script>
</body></html>
